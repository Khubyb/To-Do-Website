    // ------------------------------------------------------------------------
    // MAIN APP COMPONENT
    // ------------------------------------------------------------------------
    function App() {
      // LocalStorage state management
      const [tasks, setTasks] = useState(() => {
        const local = localStorage.getItem("td_tasks");
        return local ? JSON.parse(local) : initialTasks;
      });
      const [projects, setProjects] = useState(() => {
        const local = localStorage.getItem("td_projects");
        return local ? JSON.parse(local) : initialProjects;
      });
      const [notes, setNotes] = useState(() => {
        const local = localStorage.getItem("td_notes");
        return local ? JSON.parse(local) : initialNotes;
      });
      const [theme, setTheme] = useState(() => {
        const local = localStorage.getItem("td_theme");
        return local || "light";
      });
      const [activeView, setActiveView] = useState("overview");
      const [searchQuery, setSearchQuery] = useState("");
      const [notifications, setNotifications] = useState(initialNotifications);
      const [isSidebarOpen, setIsSidebarOpen] = useState(false);
      const [showNotifications, setShowNotifications] = useState(false);
      // Save states on changes
      useEffect(() => {
        localStorage.setItem("td_tasks", JSON.stringify(tasks));
      }, [tasks]);
      useEffect(() => {
        localStorage.setItem("td_projects", JSON.stringify(projects));
      }, [projects]);
      useEffect(() => {
        localStorage.setItem("td_notes", JSON.stringify(notes));
      }, [notes]);
      useEffect(() => {
        localStorage.setItem("td_theme", theme);
        if (theme === "dark") {
          document.body.classList.add("dark-theme");
        } else {
          document.body.classList.remove("dark-theme");
        }
      }, [theme]);
      // Global calculation states
      const completedTasksCount = useMemo(() => tasks.filter(t => t.status === "completed").length, [tasks]);
      const totalTasksCount = useMemo(() => tasks.length, [tasks]);
      const overallProgress = useMemo(() => {
        if (totalTasksCount === 0) return 0;
        return Math.round((completedTasksCount / totalTasksCount) * 100);
      }, [completedTasksCount, totalTasksCount]);
      const toggleTheme = () => {
        setTheme(prev => (prev === "light" ? "dark" : "light"));
      };
      return (
        <div className="app-container">
          <Sidebar
            activeView={activeView}
            setActiveView={setActiveView}
            isOpen={isSidebarOpen}
            setIsOpen={setIsSidebarOpen}
          />
          <div className="main-wrapper">
            <Header
              searchQuery={searchQuery}
              setSearchQuery={setSearchQuery}
              theme={theme}
              toggleTheme={toggleTheme}
              notifications={notifications}
              setNotifications={setNotifications}
              showNotifications={showNotifications}
              setShowNotifications={setShowNotifications}
              isSidebarOpen={isSidebarOpen}
              setIsSidebarOpen={setIsSidebarOpen}
            />
            <div className="content-container">
              {activeView === "overview" && (
                <Overview
                  tasks={tasks}
                  projects={projects}
                  notesCount={notes.length}
                  completedCount={completedTasksCount}
                  totalCount={totalTasksCount}
                  overallProgress={overallProgress}
                  setTasks={setTasks}
                  searchQuery={searchQuery}
                />
              )}
              {activeView === "tasks" && (
                <TaskManager
                  tasks={tasks}
                  setTasks={setTasks}
                  projects={projects}
                  searchQuery={searchQuery}
                />
              )}
              {activeView === "projects" && (
                <ProjectManager
                  projects={projects}
                  setProjects={setProjects}
                  tasks={tasks}
                />
              )}
              {activeView === "calendar" && (
                <CalendarView
                  tasks={tasks}
                />
              )}
              {activeView === "notes" && (
                <NotesManager
                  notes={notes}
                  setNotes={setNotes}
                />
              )}
              {activeView === "settings" && (
                <Settings
                  theme={theme}
                  toggleTheme={toggleTheme}
                  tasks={tasks}
                  setTasks={setTasks}
                />
              )}
              {["files", "messages"].includes(activeView) && (
                <PlaceholderView viewName={activeView} />
              )}
            </div>
          </div>
        </div>
      );
    }

              <Icon name={theme === "light" ? "moon" : "sun"} size={18} />
            </button>
            {/* Notifications Dropdown */}
            <div style={{ position: "relative" }}>
              <button
                className="notification-bell-btn"
                onClick={() => setShowNotifications(!showNotifications)}
              >
                <Icon name="bell" size={18} />
                {unreadCount > 0 && <span className="bell-badge">{unreadCount}</span>}

              {showNotifications && (
                <div className="dashboard-card" style={{
                  position: "absolute",
                  right: 0,
                  top: "50px",

                      <button onClick={handleMarkAllRead} style={{ fontSize: "11px", color: "var(--color-primary)", fontWeight: "600" }}>Mark read</button>

                    <div style={{ padding: "16px 0", textAlign: "center", fontSize: "12px", color: "var(--color-text-muted)" }}>

                    <ul style={{ listStyle: "none", display: "flex", flexDirection: "column", gap: "8px", maxHeight: "200px", overflowY: "auto" }}>

                    <button

                className="user-avatar"
              />

              <Icon name="chevron-down" className="chevron-down-icon" size={12} />
            </div>
          </div>

      );
    }
    // ------------------------------------------------------------------------
    // OVERVIEW VIEW COMPONENT
    // ------------------------------------------------------------------------
    function Overview({
      tasks,
      projects,
      notesCount,
      completedCount,
      totalCount,
      overallProgress,
      setTasks,
      searchQuery
    }) {
      const [taskWeekFilter, setTaskWeekFilter] = useState("This Week");
      const [distMonthFilter, setDistMonthFilter] = useState("This Month");
      // Dynamic tasks list filtered by header search
      const filteredTasks = useMemo(() => {
        if (!searchQuery) return tasks;
        return tasks.filter(t =>
          t.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
          t.project.toLowerCase().includes(searchQuery.toLowerCase())
        );
      }, [tasks, searchQuery]);
      // Calculate progress details for each project category
      const projectProgresses = useMemo(() => {
        return projects.map(proj => {
          const projectTasks = tasks.filter(t => t.project === proj.name);
          const total = projectTasks.length;
          const completed = projectTasks.filter(t => t.status === "completed").length;
          const left = total - completed;
          const pct = total === 0 ? 0 : Math.round((completed / total) * 100);
          return {
            name: proj.name,
            pct,
            left,
            color: proj.color
          };
        }).slice(0, 3); // Display top 3 matching the mockup
      }, [projects, tasks]);
      // Project distribution breakdown calculations
      const distribution = useMemo(() => {
        const map = {
          "Design System": { label: "Design", value: 0, color: "#7c5dfa" },
          "Social Media Plan": { label: "Planning", value: 0, color: "#ec4899" },
          "UI Wireframes": { label: "Research", value: 0, color: "#f97316" },
          "Planning": { label: "Review", value: 0, color: "#10b981" }
        };
        let activeCount = 0;
        tasks.forEach(t => {
          if (map[t.project]) {
            map[t.project].value += 1;
            activeCount++;
          }
        });
        // Safe division
        const list = Object.values(map).map(item => {
          const pct = activeCount === 0 ? 25 : Math.round((item.value / activeCount) * 100);
          return {
            ...item,
            pct,
            count: item.value
          };
        });
        return { list, total: activeCount };
      }, [tasks]);
      // Completed activity timeline (Today's Activity)
      const recentActivities = useMemo(() => {
        return tasks
          .filter(t => t.status === "completed" && t.time)
          .sort((a, b) => {
            // Sort by arbitrary day priority
            return b.time.localeCompare(a.time);
          })
          .slice(0, 4);
      }, [tasks]);
      // Sparkline coordinates math helper
      const generateSparklinePoints = (values) => {
        const width = 100;
        const height = 24;
        const max = Math.max(...values);
        const min = Math.min(...values);
        const range = max - min === 0 ? 1 : max - min;
        return values.map((val, index) => {
          const x = (index / (values.length - 1)) * width;
          const y = height - ((val - min) / range) * height + 2; // Offset buffer
          return `${x},${y}`;
        }).join(" ");
      };
      const weeklyFocusCircumference = 2 * Math.PI * 45; // r=45 -> ~282.74
      const weeklyFocusOffset = weeklyFocusCircumference - (overallProgress / 100) * weeklyFocusCircumference;
      return (
        <div className="dashboard-grid">
          {/* Row 1, Card 1: Weekly Focus (Span 6 columns) */}
          <div className="dashboard-card card-weekly-focus">
            <div className="focus-details">
              <div className="widget-header">
                <h3>Weekly Focus</h3>
                <p>Stay organized and productive</p>
              </div>
              <div className="stat-box-container">
                <div className="stat-box">
                  <div className="stat-icon">
                    <Icon name="check" size={18} />
                  </div>
                  <div className="stat-info">
                    <span className="stat-num">{completedCount}</span>
                    <span className="stat-label">Task Completed</span>
                  </div>
                </div>
                <div className="stat-box">
                  <div className="stat-icon">
                    <Icon name="project" size={18} />
                  </div>
                  <div className="stat-info">
                    <span className="stat-num">{projects.length}</span>
                    <span className="stat-label">Ongoing Projects</span>
                  </div>
                </div>
              </div>
            </div>
            <div className="focus-chart-container">
              <div className="radial-chart">
                <svg>
                  <circle cx="85" cy="85" r="45" className="radial-bg" />
                  <circle
                    cx="85"
                    cy="85"
                    r="45"
                    className="radial-progress"
                    style={{
                      strokeDasharray: weeklyFocusCircumference,
                      strokeDashoffset: weeklyFocusOffset
                    }}
                  />
                </svg>
                <div className="radial-center-text">
                  <span className="radial-percentage">{overallProgress}%</span>
                  <span className="radial-label">Overall Progress</span>
                </div>
              </div>
            </div>
          </div>
          {/* Mini Stat Card 2: Focus Hours */}
          <div className="dashboard-card card-mini-stat">
            <div className="mini-stat-header">
              <div>
                <span className="mini-stat-title">Focus Hours</span>
                <div className="mini-stat-value">24h</div>
              </div>
              <div className="mini-icon">
                <Icon name="clock" size={18} stroke="#7c5dfa" />
              </div>
            </div>
            <div className="mini-stat-footer">
              <span className="mini-stat-trend trend-up">+12% from last week</span>
              <div className="sparkline-container">
                <svg viewBox="0 0 100 30" preserveAspectRatio="none">
                  <path
                    className="sparkline-path"
                    d={`M ${generateSparklinePoints([12, 15, 14, 18, 16, 21, 24])}`}
                  />
                </svg>
              </div>
            </div>
          </div>
          {/* Mini Stat Card 3: Completed Goals */}
          <div className="dashboard-card card-mini-stat">
            <div className="mini-stat-header">
              <div>
                <span className="mini-stat-title">Completed Goals</span>
                <div className="mini-stat-value">82%</div>
              </div>
              <div className="mini-icon">
                <Icon name="task" size={18} />
              </div>
            </div>
            <div className="mini-stat-footer">
              <span className="mini-stat-trend trend-up">+9% from last week</span>
              <div className="sparkline-container">
                <svg viewBox="0 0 100 30" preserveAspectRatio="none">
                  <path
                    className="sparkline-path"
                    style={{ stroke: "#ec4899" }}
                    d={`M ${generateSparklinePoints([60, 65, 58, 70, 72, 79, 82])}`}
                  />
                </svg>
              </div>
            </div>
          </div>
          {/* Mini Stat Card 4: Notes Created */}
          <div className="dashboard-card card-mini-stat">
            <div className="mini-stat-header">
              <div>
                <span className="mini-stat-title">Notes Created</span>
                <div className="mini-stat-value">{notesCount}</div>
              </div>
              <div className="mini-icon">
                <Icon name="notes" size={18} />
              </div>
            </div>
            <div className="mini-stat-footer">
              <span className="mini-stat-trend trend-up">+15% from last week</span>
              <div className="sparkline-container">
                <svg viewBox="0 0 100 30" preserveAspectRatio="none">
                  <path
                    className="sparkline-path"
                    style={{ stroke: "#f97316" }}
                    d={`M ${generateSparklinePoints([42, 45, 48, 47, 51, 53, 56])}`}
                  />
                </svg>
              </div>
            </div>
          </div>
          {/* Row 2, Card 1: Task Progress (Span 7 columns) */}
          <div className="dashboard-card card-task-progress">
            <div className="card-header-with-actions">
              <h3>Task Progress</h3>
              <select
                className="dropdown-select"
                value={taskWeekFilter}
                onChange={e => setTaskWeekFilter(e.target.value)}
              >
                <option>This Week</option>
                <option>This Month</option>
              </select>
            </div>
            <div className="progress-list">
              {projectProgresses.map((item, idx) => (
                <div className="progress-item" key={idx}>
                  <div className="progress-item-header">
                    <span className="progress-project-name">{item.name}</span>
                    <div className="progress-stats">
                      <span className="progress-pct">{item.pct}%</span>
                      <span className="progress-tasks-left">{item.left} tasks left</span>
                    </div>
                  </div>
                  <div className="bar-container">
                    <div
                      className="bar-fill"
                      style={{
                        width: `${item.pct}%`,
                        backgroundColor: item.color
                      }}
                    />
                  </div>
                </div>
              ))}
            </div>
          </div>
          {/* Row 2, Card 2: Project Distribution (Span 5 columns) */}
          <div className="dashboard-card card-project-dist">
            <div className="card-header-with-actions">
              <h3>Project Distribution</h3>
              <select
                className="dropdown-select"
                value={distMonthFilter}
                onChange={e => setDistMonthFilter(e.target.value)}
              >
                <option>This Month</option>
                <option>This Quarter</option>
              </select>
            </div>
            <div className="dist-content-container">
              <div className="donut-chart-wrapper">
                <svg>
                  {/* Dynamic stacked segment rendering */}
                  {(() => {
                    let totalPercentOffset = 0;
                    const r = 36;
                    const circumference = 2 * Math.PI * r;
                    return distribution.list.map((item, index) => {
                      const segmentLength = (item.pct / 100) * circumference;
                      const offset = circumference - segmentLength;
                      const strokeDashOffset = circumference - (totalPercentOffset / 100) * circumference;
                      totalPercentOffset += item.pct;
                      return (
                        <circle
                          key={index}
                          cx="75"
                          cy="75"
                          r={r}
                          className="donut-slice"
                          style={{
                            stroke: item.color,
                            strokeDasharray: `${segmentLength} ${circumference}`,
                            strokeDashoffset: strokeDashOffset
                          }}
                        />
                      );
                    });
                  })()}
                </svg>
                <div className="donut-center-text">
                  <span className="num">{distribution.total}</span>
                  <span className="lbl">Tickets</span>
                </div>
              </div>
              <ul className="dist-legend-list">
                {distribution.list.map((item, index) => (
                  <li className="dist-legend-item" key={index}>
                    <span className="legend-dot" style={{ backgroundColor: item.color }} />
                    <span className="legend-name">{item.label}</span>
                    <span className="legend-pct-val">{item.pct}%</span>
                    <span className="legend-count">({item.count})</span>
                  </li>
                ))}
              </ul>
            </div>
          </div>
          {/* Row 3: Today's Activity Timeline (Span 12 columns) */}
          <div className="dashboard-card card-today-activity">
            <div className="card-header-with-actions" style={{ marginBottom: "28px" }}>
              <h3>Today's Activity</h3>
            </div>
            <div className="activity-timeline">
              {recentActivities.length === 0 ? (
                <div style={{ textAlign: "center", padding: "30px", color: "var(--color-text-muted)" }}>
                  No activity logged today. Complete a task with an assigned time trigger to view metrics here.
                </div>
              ) : (
                recentActivities.map((act, index) => (
                  <div className="activity-item completed" key={act.id}>
                    <div className="activity-time">{act.time}</div>
                    <div className="activity-indicator">
                      <div className="activity-indicator-dot" />
                    </div>
                    <div className="activity-card">
                      <div className="activity-card-left">
                        <div className="activity-icon-wrapper">
                          <Icon
                            name={act.project === "Design System" ? "overview" : act.project === "Social Media Plan" ? "messages" : "project"}
                            size={16}
                          />
                        </div>
                        <span className="activity-title-text">{act.title}</span>
                      </div>
                      <div className="activity-card-right">
                        <span
                          className="category-badge"
                          style={{
                            backgroundColor: act.project === "Design System" ? "var(--color-primary-light)" : act.project === "Social Media Plan" ? "#fdf2f8" : "#fff7ed",
                            color: act.project === "Design System" ? "var(--color-primary)" : act.project === "Social Media Plan" ? "#ec4899" : "#f97316"
                          }}
                        >
                          {act.project}
                        </span>
                        
                        <div className="activity-avatars">
                          {act.assignees.map((avatar, aIdx) => (
                            <img
                              key={aIdx}
                              src={avatar}
                              alt="User avatar"
                              className="avatar-stack-img"
                            />
                          ))}
                        </div>
                        <button className="activity-menu-btn" onClick={() => {
                          // Change status back to in-progress for demo
                          if (confirm("Reset task back to In-Progress state?")) {
                            setTasks(prev => prev.map(t => t.id === act.id ? { ...t, status: "in-progress" } : t));
                          }
                        }}>
                          <Icon name="more" size={16} />
                        </button>
                      </div>
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      );
    }
    // ------------------------------------------------------------------------
    // TASK MANAGER COMPONENT
    // ------------------------------------------------------------------------
    function TaskManager({ tasks, setTasks, projects, searchQuery }) {
      const [showModal, setShowModal] = useState(false);
      const [filterProject, setFilterProject] = useState("All");
      const [editTaskId, setEditTaskId] = useState(null);
      // Form state
      const [taskForm, setTaskForm] = useState({
        title: "",
        description: "",
        project: "Design System",
        dueDate: "",
        priority: "medium",
        time: ""
      });
      // Filtered columns
      const filteredTasks = useMemo(() => {
        return tasks.filter(t => {
          const matchProj = filterProject === "All" || t.project === filterProject;
          const matchSearch = !searchQuery || t.title.toLowerCase().includes(searchQuery.toLowerCase()) || t.description.toLowerCase().includes(searchQuery.toLowerCase());
          return matchProj && matchSearch;
        });
      }, [tasks, filterProject, searchQuery]);
      const columns = {
        todo: filteredTasks.filter(t => t.status === "todo"),
        "in-progress": filteredTasks.filter(t => t.status === "in-progress"),
        completed: filteredTasks.filter(t => t.status === "completed")
      };
      const handleSaveTask = (e) => {
        e.preventDefault();
        if (!taskForm.title.trim()) return;
        if (editTaskId) {
          // Update Mode
          setTasks(prev => prev.map(t => t.id === editTaskId ? { ...t, ...taskForm } : t));
        } else {
          // Insert Mode
          const newTask = {
            id: `t_${Date.now()}`,
            ...taskForm,
            status: "todo",
            assignees: ["https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=60"]
          };
          setTasks(prev => [...prev, newTask]);
        }
        // Reset
        setTaskForm({ title: "", description: "", project: "Design System", dueDate: "", priority: "medium", time: "" });
        setEditTaskId(null);
        setShowModal(false);
      };
      const handleOpenEdit = (task) => {
        setTaskForm({
          title: task.title,
          description: task.description,
          project: task.project,
          dueDate: task.dueDate || "",
          priority: task.priority || "medium",
          time: task.time || ""
        });
        setEditTaskId(task.id);
        setShowModal(true);
      };
      const handleDeleteTask = (id) => {
        if (confirm("Delete this task?")) {
          setTasks(prev => prev.filter(t => t.id !== id));
        }
      };
      const changeStatus = (id, newStatus) => {
        setTasks(prev => prev.map(t => {
          if (t.id === id) {
            // Auto stamp current time if completed
            let timeString = t.time;
            if (newStatus === "completed" && !timeString) {
              const now = new Date();
              timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }
            return { ...t, status: newStatus, time: timeString };
          }
          return t;
        }));
      };
      return (
        <div className="task-manager-container">
          <div className="view-header">
            <div className="view-header-title">
              <h2>Task Board</h2>
              <p>Organize, schedule, and track workflow tickets</p>
            </div>
            <button className="primary-btn" onClick={() => {
              setEditTaskId(null);
              setTaskForm({ title: "", description: "", project: "Design System", dueDate: new Date().toISOString().split('T')[0], priority: "medium", time: "" });
              setShowModal(true);
            }}>
              <Icon name="plus" size={16} />
              <span>Add New Task</span>
            </button>
          </div>
          <div className="task-toolbar">
            <div className="toolbar-filters">
              <button
                className={`filter-btn ${filterProject === "All" ? "active" : ""}`}
                onClick={() => setFilterProject("All")}
              >
                All Projects
              </button>
              {projects.map(p => (
                <button
                  key={p.id}
                  className={`filter-btn ${filterProject === p.name ? "active" : ""}`}
                  onClick={() => setFilterProject(p.name)}
                >
                  {p.name}
                </button>
              ))}
            </div>
          </div>
          {/* Kanban columns */}
          <div className="kanban-grid">
            {Object.keys(columns).map(colKey => (
              <div className="kanban-column" key={colKey}>
                <div className="column-header">
                  <span className="column-title">
                    <span
                      style={{
                        width: "8px",
                        height: "8px",
                        borderRadius: "50%",
                        backgroundColor: colKey === "todo" ? "var(--color-text-muted)" : colKey === "in-progress" ? "var(--color-warning)" : "var(--color-success)"
                      }}
                    />
                    {colKey === "todo" ? "To Do" : colKey === "in-progress" ? "In Progress" : "Completed"}
                  </span>
                  <span className="column-badge">{columns[colKey].length}</span>
                </div>
                {columns[colKey].map(task => (
                  <div className="task-card" key={task.id}>
                    <div className="task-card-header">
                      <span
                        className="task-project-tag"
                        style={{
                          backgroundColor: projects.find(p => p.name === task.project)?.bgLight || "var(--color-primary-light)",
                          color: projects.find(p => p.name === task.project)?.color || "var(--color-primary)"
                        }}
                      >
                        {task.project}
                      </span>
                      <div className="task-actions">
                        <button className="task-action-btn" onClick={() => handleOpenEdit(task)} title="Edit Task">
                          <Icon name="edit" size={13} />
                        </button>
                        <button className="task-action-btn" onClick={() => handleDeleteTask(task.id)} title="Delete Task">
                          <Icon name="trash" size={13} />
                        </button>
                      </div>
                    </div>
                    <h4 className="task-card-title">{task.title}</h4>
                    <p className="task-card-desc">{task.description}</p>
                    <div className="task-card-footer">
                      <div className="task-date">
                        <Icon name="calendar" size={12} />
                        <span>{task.dueDate || "No Date"}</span>
                      </div>
                      
                      <div style={{ display: "flex", gap: "8px", alignItems: "center" }}>
                        <span className={`task-priority-indicator priority-${task.priority}`}>
                          {task.priority}
                        </span>
                        {/* Shift Control arrows (Instead of drag-and-drop complexity) */}
                        <div style={{ display: "flex", gap: "4px" }}>
                          {colKey !== "todo" && (
                            <button
                              className="task-action-btn"
                              onClick={() => changeStatus(task.id, colKey === "completed" ? "in-progress" : "todo")}
                              title="Move Left"
                            >
                              <Icon name="chevron-left" size={12} />
                            </button>
                          )}
                          {colKey !== "completed" && (
                            <button
                              className="task-action-btn"
                              onClick={() => changeStatus(task.id, colKey === "todo" ? "in-progress" : "completed")}
                              title="Move Right"
                            >
                              <Icon name="chevron-right" size={12} />
                            </button>
                          )}
                        </div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            ))}
          </div>
          {/* Task Modal Dialog */}
          {showModal && (
            <div className="modal-overlay">
              <div className="modal-content">
                <div className="modal-header">
                  <h3>{editTaskId ? "Edit Task" : "Create New Task"}</h3>
                  <button className="close-btn" onClick={() => setShowModal(false)}>
                    <Icon name="x" size={18} />
                  </button>
                </div>
                <form onSubmit={handleSaveTask} style={{ display: "flex", flexDirection: "column", gap: "16px" }}>
                  <div className="form-group">
                    <label>Task Title</label>
                    <input
                      type="text"
                      className="form-control"
                      placeholder="e.g. Design main wireframe cards"
                      value={taskForm.title}
                      onChange={e => setTaskForm({ ...taskForm, title: e.target.value })}
                      required
                    />
                  </div>
                  <div className="form-group">
                    <label>Description</label>
                    <textarea
                      className="form-control"
                      placeholder="Provide scoping details..."
                      rows="3"
                      value={taskForm.description}
                      onChange={e => setTaskForm({ ...taskForm, description: e.target.value })}
                    />
                  </div>
                  <div className="form-row">
                    <div className="form-group">
                      <label>Project Category</label>
                      <select
                        className="form-control"
                        value={taskForm.project}
                        onChange={e => setTaskForm({ ...taskForm, project: e.target.value })}
                      >
                        {projects.map(p => (
                          <option key={p.id} value={p.name}>{p.name}</option>
                        ))}
                      </select>
                    </div>
                    <div className="form-group">
                      <label>Priority</label>
                      <select
                        className="form-control"
                        value={taskForm.priority}
                        onChange={e => setTaskForm({ ...taskForm, priority: e.target.value })}
                      >
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                      </select>
                    </div>
                  </div>
                  <div className="form-row">
                    <div className="form-group">
                      <label>Due Date</label>
                      <input
                        type="date"
                        className="form-control"
                        value={taskForm.dueDate}
                        onChange={e => setTaskForm({ ...taskForm, dueDate: e.target.value })}
                      />
                    </div>
                    <div className="form-group">
                      <label>Daily Activity Time stamp (optional)</label>
                      <input
                        type="text"
                        className="form-control"
                        placeholder="e.g. 09:00 AM"
                        value={taskForm.time}
                        onChange={e => setTaskForm({ ...taskForm, time: e.target.value })}
                      />
                    </div>
                  </div>
                  <div className="form-actions">
                    <button type="button" className="secondary-btn" onClick={() => setShowModal(false)}>
                      Cancel
                    </button>
                    <button type="submit" className="primary-btn">
                      {editTaskId ? "Save Changes" : "Create Ticket"}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }
    // ------------------------------------------------------------------------
    // PROJECTS MANAGER COMPONENT
    // ------------------------------------------------------------------------
    function ProjectManager({ projects, setProjects, tasks }) {
      const [showModal, setShowModal] = useState(false);
      const [newProj, setNewProj] = useState({ name: "", desc: "", color: "#7c5dfa" });
      const handleAddProject = (e) => {
        e.preventDefault();
        if (!newProj.name.trim()) return;
        const created = {
          id: `p_${Date.now()}`,
          name: newProj.name,
          desc: newProj.desc,
          color: newProj.color,
          bgLight: `${newProj.color}15`,
          icon: "project"
        };
        setProjects(prev => [...prev, created]);
        setNewProj({ name: "", desc: "", color: "#7c5dfa" });
        setShowModal(false);
      };
      return (
        <div className="task-manager-container">
          <div className="view-header">
            <div className="view-header-title">
              <h2>Project Workspaces</h2>
              <p>Configure project categories, progress limits, and metrics</p>
            </div>
            <button className="primary-btn" onClick={() => setShowModal(true)}>
              <Icon name="plus" size={16} />
              <span>New Project</span>
            </button>
          </div>
          <div className="projects-grid">
            {projects.map(proj => {
              const projectTasks = tasks.filter(t => t.project === proj.name);
              const total = projectTasks.length;
              const completed = projectTasks.filter(t => t.status === "completed").length;
              const progressPct = total === 0 ? 0 : Math.round((completed / total) * 100);
              return (
                <div className="project-card" key={proj.id}>
                  <div className="project-card-header">
                    <div className="project-icon-box" style={{ backgroundColor: proj.bgLight || `${proj.color}15`, color: proj.color }}>
                      <Icon name={proj.icon || "project"} size={22} />
                    </div>
                    <button className="task-action-btn" onClick={() => {
                      if (confirm(`Remove project workspace ${proj.name}?`)) {
                        setProjects(prev => prev.filter(p => p.id !== proj.id));
                      }
                    }}>
                      <Icon name="trash" size={14} />
                    </button>
                  </div>
                  <div className="project-info-main">
                    <h3 className="project-title">{proj.name}</h3>
                    <p className="project-desc">{proj.desc}</p>
                  </div>
                  <div className="project-progress-container">
                    <div className="project-progress-lbls">
                      <span style={{ color: "var(--color-text-title)" }}>Progress</span>
                      <span style={{ color: proj.color }}>{progressPct}%</span>
                    </div>
                    <div className="bar-container" style={{ height: "6px" }}>
                      <div className="bar-fill" style={{ width: `${progressPct}%`, backgroundColor: proj.color }} />
                    </div>
                  </div>
                  <div className="project-meta-footer">
                    <div className="project-meta-item">
                      <Icon name="task" size={12} />
                      <span>{total} Tickets logged</span>
                    </div>
                    <div className="project-meta-item">
                      <Icon name="check" size={12} />
                      <span>{completed} Completed</span>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
          {showModal && (
            <div className="modal-overlay">
              <div className="modal-content">
                <div className="modal-header">
                  <h3>Add Project Workspace</h3>
                  <button className="close-btn" onClick={() => setShowModal(false)}>
                    <Icon name="x" size={18} />
                  </button>
                </div>
                <form onSubmit={handleAddProject} style={{ display: "flex", flexDirection: "column", gap: "16px" }}>
                  <div className="form-group">
                    <label>Project Name</label>
                    <input
                      type="text"
                      className="form-control"
                      placeholder="e.g. Mobile Apps Integration"
                      value={newProj.name}
                      onChange={e => setNewProj({ ...newProj, name: e.target.value })}
                      required
                    />
                  </div>
                  <div className="form-group">
                    <label>Description</label>
                    <textarea
                      className="form-control"
                      placeholder="Scoping scope and resources..."
                      value={newProj.desc}
                      onChange={e => setNewProj({ ...newProj, desc: e.target.value })}
                      rows="3"
                    />
                  </div>
                  <div className="form-group">
                    <label>Brand Theme Color</label>
                    <input
                      type="color"
                      className="form-control"
                      style={{ height: "45px", padding: "4px", cursor: "pointer" }}
                      value={newProj.color}
                      onChange={e => setNewProj({ ...newProj, color: e.target.value })}
                    />
                  </div>
                  <div className="form-actions">
                    <button type="button" className="secondary-btn" onClick={() => setShowModal(false)}>
                      Cancel
                    </button>
                    <button type="submit" className="primary-btn">
                      Add Workspace
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }
    // ------------------------------------------------------------------------
    // CALENDAR VIEW COMPONENT
    // ------------------------------------------------------------------------
    function CalendarView({ tasks }) {
      const [currentDate, setCurrentDate] = useState(new Date());
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      const daysOfWeek = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      const handlePrevMonth = () => {
        setCurrentDate(new Date(year, month - 1, 1));
      };
      const handleNextMonth = () => {
        setCurrentDate(new Date(year, month + 1, 1));
      };
      const calendarDays = useMemo(() => {
        // Date computations
        const firstDayIndex = new Date(year, month, 1).getDay();
        const lastDayDate = new Date(year, month + 1, 0).getDate();
        const prevMonthLastDay = new Date(year, month, 0).getDate();
        const cells = [];
        // Previous month filler days
        for (let i = firstDayIndex - 1; i >= 0; i--) {
          const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(prevMonthLastDay - i).padStart(2, '0')}`;
          cells.push({
            day: prevMonthLastDay - i,
            dateString: dateStr,
            isCurrentMonth: false
          });
        }
        // Current month active days
        const todayStr = new Date().toISOString().split('T')[0];
        for (let i = 1; i <= lastDayDate; i++) {
          const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
          cells.push({
            day: i,
            dateString: dateStr,
            isCurrentMonth: true,
            isToday: dateStr === todayStr
          });
        }
        // Next month filler days (fill up to grid multiple of 7)
        const totalCells = cells.length;
        const remainder = totalCells % 7;
        if (remainder > 0) {
          const nextDaysNeeded = 7 - remainder;
          for (let i = 1; i <= nextDaysNeeded; i++) {
            const dateStr = `${year}-${String(month + 2).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
            cells.push({
              day: i,
              dateString: dateStr,
              isCurrentMonth: false
            });
          }
        }
        return cells;
      }, [year, month]);
      return (
        <div className="task-manager-container">
          <div className="view-header">
            <div className="view-header-title">
              <h2>Calendar Calendar</h2>
              <p>Schedule view of daily logs and project target completions</p>
            </div>
          </div>
          <div className="calendar-wrapper">
            <div className="calendar-header">
              <h3>{monthNames[month]} {year}</h3>
              <div className="calendar-nav">
                <button className="calendar-nav-btn" onClick={handlePrevMonth}>
                  <Icon name="chevron-left" size={16} />
                </button>
                <button className="calendar-nav-btn" onClick={handleNextMonth}>
                  <Icon name="chevron-right" size={16} />
                </button>
              </div>
            </div>
            <div className="calendar-grid">
              {daysOfWeek.map(day => (
                <div className="calendar-day-header" key={day}>{day}</div>
              ))}
              {calendarDays.map((cell, idx) => {
                const dayTasks = tasks.filter(t => t.dueDate === cell.dateString);
                
                return (
                  <div
                    key={idx}
                    className={`calendar-cell ${!cell.isCurrentMonth ? "different-month" : ""} ${cell.isToday ? "today" : ""}`}
                  >
                    <span className="calendar-date-number">{cell.day}</span>
                    <div className="calendar-cell-events">
                      {dayTasks.map(t => (
                        <div
                          key={t.id}
                          className="calendar-event-dot"
                          style={{
                            backgroundColor: t.status === "completed" ? "var(--color-success-light)" : "var(--color-primary-light)",
                            color: t.status === "completed" ? "var(--color-success)" : "var(--color-primary)"
                          }}
                          title={t.title}
                        >
                          {t.title}
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }
    // ------------------------------------------------------------------------
    // NOTES COMPONENT
    // ------------------------------------------------------------------------
    function NotesManager({ notes, setNotes }) {
      const [showModal, setShowModal] = useState(false);
      const [noteForm, setNoteForm] = useState({ title: "", content: "" });
      const [editId, setEditId] = useState(null);
      const handleSaveNote = (e) => {
        e.preventDefault();
        if (!noteForm.title.trim()) return;
        if (editId) {
          setNotes(prev => prev.map(n => n.id === editId ? { ...n, ...noteForm } : n));
        } else {
          const newNote = {
            id: `n_${Date.now()}`,
            title: noteForm.title,
            content: noteForm.content,
            date: new Date().toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' })
          };
          setNotes(prev => [newNote, ...prev]);
        }
        setNoteForm({ title: "", content: "" });
        setEditId(null);
        setShowModal(false);
      };
      const handleOpenEdit = (n) => {
        setNoteForm({ title: n.title, content: n.content });
        setEditId(n.id);
        setShowModal(true);
      };
      const handleDelete = (id, e) => {
        e.stopPropagation();
        if (confirm("Delete note permanently?")) {
          setNotes(prev => prev.filter(n => n.id !== id));
        }
      };
      return (
        <div className="task-manager-container">
          <div className="view-header">
            <div className="view-header-title">
              <h2>Quick Notes</h2>
              <p>Jot down ideas, guidelines, templates, and feedback checklists</p>
            </div>
            <button className="primary-btn" onClick={() => {
              setEditId(null);
              setNoteForm({ title: "", content: "" });
              setShowModal(true);
            }}>
              <Icon name="plus" size={16} />
              <span>Create Note</span>
            </button>
          </div>
          <div className="notes-grid">
            {notes.map(n => (
              <div className="note-card" key={n.id} onClick={() => handleOpenEdit(n)}>
                <div className="note-body">
                  <h4 className="note-title">{n.title}</h4>
                  <p className="note-content">{n.content}</p>
                </div>
                <div className="note-footer">
                  <span className="note-date">{n.date}</span>
                  <button className="note-delete-btn" onClick={(e) => handleDelete(n.id, e)}>
                    <Icon name="trash" size={13} />
                  </button>
                </div>
              </div>
            ))}
            <div className="note-card add-note-card" onClick={() => {
              setEditId(null);
              setNoteForm({ title: "", content: "" });
              setShowModal(true);
            }}>
              <Icon name="plus" size={24} className="add-note-icon" />
              <span>Create Note</span>
            </div>
          </div>
          {showModal && (
            <div className="modal-overlay">
              <div className="modal-content">
                <div className="modal-header">
                  <h3>{editId ? "Edit Note" : "Write Quick Note"}</h3>
                  <button className="close-btn" onClick={() => setShowModal(false)}>
                    <Icon name="x" size={18} />
                  </button>
                </div>
                <form onSubmit={handleSaveNote} style={{ display: "flex", flexDirection: "column", gap: "16px" }}>
                  <div className="form-group">
                    <label>Note Header</label>
                    <input
                      type="text"
                      className="form-control"
                      placeholder="e.g. Coding Standards"
                      value={noteForm.title}
                      onChange={e => setNoteForm({ ...noteForm, title: e.target.value })}
                      required
                    />
                  </div>
                  <div className="form-group">
                    <label>Content Description</label>
                    <textarea
                      className="form-control"
                      placeholder="Write your note down..."
                      rows="6"
                      value={noteForm.content}
                      onChange={e => setNoteForm({ ...noteForm, content: e.target.value })}
                    />
                  </div>
                  <div className="form-actions">
                    <button type="button" className="secondary-btn" onClick={() => setShowModal(false)}>
                      Cancel
                    </button>
                    <button type="submit" className="primary-btn">
                      Save Note
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }
    // ------------------------------------------------------------------------
    // SETTINGS COMPONENT
    // ------------------------------------------------------------------------
    function Settings({ theme, toggleTheme, tasks, setTasks }) {
      const handleResetData = () => {
        if (confirm("Reset dashboard data to factory templates? All custom tasks will be erased.")) {
          setTasks(initialTasks);
          localStorage.removeItem("td_tasks");
          alert("Dashboard data restored to mockup state.");
        }
      };
      return (
        <div className="task-manager-container">
          <div className="view-header">
            <div className="view-header-title">
              <h2>Workspace Settings</h2>
              <p>Configure theme parameters and dashboard overrides</p>
            </div>
          </div>
          <div className="dashboard-card settings-card">
            <div className="settings-section">
              <span className="settings-section-title">Color Scheme Preference</span>
              <div className="theme-options">
                <button
                  className={`theme-option-btn ${theme === "light" ? "active" : ""}`}
                  onClick={() => { if (theme === "dark") toggleTheme(); }}
                >
                  <Icon name="sun" size={16} />
                  <span>Light Palette</span>
                </button>
                <button
                  className={`theme-option-btn ${theme === "dark" ? "active" : ""}`}
                  onClick={() => { if (theme === "light") toggleTheme(); }}
                >
                  <Icon name="moon" size={16} />
                  <span>Dark Palette</span>
                </button>
              </div>
            </div>
            <div className="settings-section">
              <span className="settings-section-title">Data Administration</span>
              <p style={{ fontSize: "13px", color: "var(--color-text-body)", lineHeight: "1.5" }}>
                Troubleshoot dashboard sync state. You can revert changes to sync exactly with the initial mockup tasks.
              </p>
              <button
                className="secondary-btn"
                style={{ color: "var(--color-danger)", borderColor: "var(--color-danger-light)", alignSelf: "flex-start" }}
                onClick={handleResetData}
              >
                Reset Mockup Seed Data
              </button>
            </div>
          </div>
        </div>
      );
    }
    // ------------------------------------------------------------------------
    // PLACEHOLDER VIEWS
    // ------------------------------------------------------------------------
    function PlaceholderView({ viewName }) {
      return (
        <div className="task-manager-container" style={{ alignItems: "center", justifyContent: "center", padding: "100px 0" }}>
          <div className="dashboard-card" style={{ textAlign: "center", maxWidth: "450px", padding: "40px" }}>
            <div className="mini-icon" style={{ margin: "0 auto 20px", width: "50px", height: "50px", borderRadius: "50%" }}>
              <Icon name={viewName === "files" ? "files" : "messages"} size={24} />
            </div>
            <h2 style={{ fontSize: "20px", fontWeight: "700", color: "var(--color-text-title)", marginBottom: "8px" }}>
              {viewName.toUpperCase()} section
            </h2>
            <p style={{ fontSize: "13px", color: "var(--color-text-body)", lineHeight: "1.6" }}>
              This view handles {viewName === "files" ? "document vaults and digital asset storage uploads" : "live chats and team collaboration alerts"}.
              This placeholder can be connected to backend APIs.
            </p>
          </div>
        </div>
      );
    }
    // Mount App
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
  <!-- External React JavaScript File -->
  <script type="text/babel" src="app.js" defer></script>
